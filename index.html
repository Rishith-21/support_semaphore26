
<!doctype html>
<html lang="en">
  <head>
    <!-- ================================
         BASIC DOCUMENT CONFIG
    ================================= -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#020617"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- ================================
         TITLE & SEO
    ================================= -->
    <title>Semaphore 2K26 | Where Innovation Meets Imagination</title>

    <meta
      name="description"
      content="Semaphore 2K26 — an immersive tech experience featuring innovation, creativity, technology, events and unforgettable digital experiences."
    />

    <meta
      name="keywords"
      content="Semaphore 2K26, Semaphore, tech fest, technology, innovation, coding, events, college fest"
    />

    <meta
      name="author"
      content="Semaphore 2K26"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://your-domain.com/"
    />

    <!-- ================================
         FAVICON
    ================================= -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- ================================
         OPEN GRAPH / SOCIAL SHARING
    ================================= -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Semaphore 2K26"
    />

    <meta
      property="og:description"
      content="Step into Semaphore 2K26 — an immersive world of technology, creativity and innovation."
    />

    <meta
      property="og:url"
      content="https://your-domain.com/"
    />

    <meta
      property="og:image"
      content="https://your-domain.com/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Semaphore 2K26"
    />

    <meta
      property="og:site_name"
      content="Semaphore 2K26"
    />

    <!-- ================================
         TWITTER / X CARD
    ================================= -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Semaphore 2K26"
    />

    <meta
      name="twitter:description"
      content="An immersive technology and innovation experience."
    />

    <meta
      name="twitter:image"
      content="https://your-domain.com/og-image.jpg"
    />

    <!-- ================================
         MOBILE / PWA FRIENDLY
    ================================= -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Semaphore 2K26"
    />

    <!-- ================================
         PERFORMANCE
    ================================= -->

    <!-- Establish connection early for external resources -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- ================================
         FONT
    ================================= -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ================================
         STRUCTURED DATA
    ================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Semaphore 2K26",
        "description": "An immersive technology, innovation and creativity event.",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode"
      }
    </script>
  </head>

  <body>
    <!--
      React application root.
      The entire UI is rendered inside this element.
    -->
    <div id="root"></div>

    <!--
      Vite / React entry point
    -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
